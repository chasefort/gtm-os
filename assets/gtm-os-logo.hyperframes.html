<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GTM OS animated logo</title>
    <style>
      :root {
        --ink: #101114;
        --muted: #6f778a;
        --paper: #f7f8fb;
        --line: rgba(16, 17, 20, 0.1);
        --accent: #5e6ad2;
        --accent-2: #5ad7ff;
        --violet: #8a8dff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      [data-composition-id="gtm-os-logo"] {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink);
      }

      .logo-shell {
        width: min(100%, 620px);
        height: 136px;
        display: grid;
        grid-template-columns: 106px minmax(0, 1fr);
        align-items: center;
        gap: 24px;
        padding: 18px 26px 18px 18px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(247, 248, 251, 0.74)),
          radial-gradient(circle at 18% 15%, rgba(138, 141, 255, 0.2), transparent 36%),
          radial-gradient(circle at 92% 82%, rgba(90, 215, 255, 0.16), transparent 32%);
        box-shadow: 0 24px 70px rgba(16, 17, 20, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.86);
        position: relative;
        overflow: hidden;
      }

      .logo-shell::before {
        content: "";
        position: absolute;
        inset: -1px;
        pointer-events: none;
        background:
          linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent),
          repeating-linear-gradient(90deg, transparent 0 27px, rgba(94, 106, 210, 0.09) 27px 28px);
        opacity: 0.56;
        transform: translateX(-74%);
        animation: shell-scan 4.8s cubic-bezier(0.19, 1, 0.22, 1) infinite;
      }

      .orb {
        width: 92px;
        height: 92px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        position: relative;
        background: linear-gradient(135deg, var(--violet), var(--accent) 54%, var(--accent-2));
        box-shadow: 0 0 34px rgba(94, 106, 210, 0.38), 0 18px 42px rgba(90, 215, 255, 0.18);
        isolation: isolate;
      }

      .orb::before,
      .orb::after {
        content: "";
        position: absolute;
        inset: 14px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.58);
        animation: orbit 5.2s linear infinite;
      }

      .orb::after {
        inset: 24px;
        opacity: 0.56;
        animation-duration: 3.8s;
        animation-direction: reverse;
      }

      .node {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--paper);
        box-shadow: 0 0 18px rgba(255, 255, 255, 0.85);
        position: absolute;
      }

      .node-a { top: 14px; left: 42px; }
      .node-b { right: 18px; top: 42px; }
      .node-c { bottom: 16px; left: 44px; }
      .core {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        background: rgba(247, 248, 251, 0.92);
        box-shadow: inset 0 0 0 1px rgba(16, 17, 20, 0.08);
        z-index: 1;
      }

      .word {
        min-width: 0;
        position: relative;
        z-index: 1;
      }

      .kicker {
        color: var(--accent);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .title {
        display: flex;
        align-items: baseline;
        gap: 12px;
        color: var(--ink);
        font-size: clamp(42px, 8vw, 68px);
        line-height: 0.9;
        font-weight: 800;
        letter-spacing: -0.055em;
        white-space: nowrap;
      }

      .os {
        color: var(--accent);
        text-shadow: 0 0 20px rgba(94, 106, 210, 0.2);
      }

      .trace {
        width: 100%;
        height: 3px;
        margin-top: 18px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--violet), var(--accent-2), transparent);
        transform-origin: left center;
        animation: trace 3.4s ease-in-out infinite;
      }

      @keyframes shell-scan {
        0%, 38% { transform: translateX(-76%); }
        72%, 100% { transform: translateX(76%); }
      }

      @keyframes orbit {
        to { transform: rotate(360deg); }
      }

      @keyframes trace {
        0%, 100% { transform: scaleX(0.28); opacity: 0.46; }
        50% { transform: scaleX(1); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .logo-shell::before,
        .orb::before,
        .orb::after,
        .trace {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div
      data-composition-id="gtm-os-logo"
      data-width="640"
      data-height="180"
      data-duration="5"
      data-track-index="1"
      aria-label="Animated GTM OS logo"
    >
      <div class="logo-shell">
        <div class="orb" aria-hidden="true">
          <span class="node node-a"></span>
          <span class="node node-b"></span>
          <span class="node node-c"></span>
          <span class="core"></span>
        </div>
        <div class="word">
          <div class="kicker">Cited GTM answers from messy business docs</div>
          <div class="title"><span>GTM</span><span class="os">OS</span></div>
          <div class="trace"></div>
        </div>
      </div>
    </div>
  </body>
</html>
